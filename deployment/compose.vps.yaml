services:
  web:
    build: {context: ..}
    restart: unless-stopped
    expose: ["3000"]
    environment:
      NODE_ENV: production
      ROBINHOOD_RPC_URL: ${ROBINHOOD_RPC_URL:-https://rpc.testnet.chain.robinhood.com}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  worker:
    build: {context: ..}
    command: ["node", "worker.mjs"]
    restart: unless-stopped
    volumes: ["worker-data:/app/data"]
    environment:
      ROBINHOOD_RPC_URL: ${ROBINHOOD_RPC_URL:-https://rpc.testnet.chain.robinhood.com}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  worker-data:
  caddy-data:
  caddy-config:
